const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:B(P.s),iterations:P.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.v)},k,B(P.c)));}
async function go(pw,remember,silent){const m=document.getElementById('m');m.textContent=silent?'':'확인 중...';
try{const h=await dec(pw);if(remember){try{localStorage.setItem('dk',pw)}catch(e){}}document.open();document.write(h);document.close();}
catch(e){if(!silent)m.textContent='비밀번호가 맞지 않습니다';try{localStorage.removeItem('dk')}catch(e2){}}}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('p').value,document.getElementById('r').checked,false)});
try{const s=localStorage.getItem('dk');if(s)go(s,true,true)}catch(e){}
</script></body></html>
